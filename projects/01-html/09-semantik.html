<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen Semantik HTML5</title>
</head>
<body>
    <header>  <!-- Bagian atas halaman -->
        <h1>Logo / Judul Website</h1>
    </header>
    <nav>     <!-- Navigasi -->
        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Tentang</a></li>
        </ul>
    </nav>
    <main>    <!-- Konten utama -->
        <section> <!-- Bagian/seksi -->
            <h2>Artikel Terbaru</h2>
            <article> <!-- Artikel/konten mandiri -->
                <h3>Judul Artikel</h3>
                <p>Isi artikel menarik di sini...</p>
            </article>
        </section>
        <aside>   <!-- Konten samping/sidebar -->
            <h3>Informasi Tambahan</h3>
            <p>Iklan atau link populer...</p>
        </aside>
    </main>
    <footer>  <!-- Bagian bawah halaman -->
        <p>&copy; 2026 Belajar Website</p>
    </footer>
</body>
</html>
