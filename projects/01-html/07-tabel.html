<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel HTML</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Umur</th>
                <th>Kota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Budi</td>
                <td>20</td>
                <td>Jakarta</td>
            </tr>
            <tr>
                <td>Siti</td>
                <td>22</td>
                <td>Bandung</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
