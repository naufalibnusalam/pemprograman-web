<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List (Daftar) HTML</title>
</head>
<body>
    <!-- Unordered List (tanpa nomor) -->
    <ul>
        <li>Apel</li>
        <li>Jeruk</li>
        <li>Mangga</li>
    </ul>

    <!-- Ordered List (dengan nomor) -->
    <ol>
        <li>Langkah pertama</li>
        <li>Langkah kedua</li>
        <li>Langkah ketiga</li>
    </ol>
</body>
</html>
