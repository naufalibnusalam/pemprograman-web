<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Cara Menulis CSS</title>

    <!-- 2. Internal CSS -->
    <style>
        p { color: blue; }
    </style>

    <!-- 3. External CSS (DIREKOMENDASIKAN) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Inline CSS -->
    <p style="color: blue; font-size: 18px;">Teks biru dengan Inline CSS</p>
    
    <p>Teks ini dipengaruhi oleh Internal CSS atau External CSS.</p>
</body>
</html>
