<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator — Proyek Latihan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="container">
        <div class="calculator">
            <!-- Display -->
            <div class="display">
                <div class="display-expression" id="expression"></div>
                <div class="display-result" id="result">0</div>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="btn-calc btn-clear-all" data-action="clear">C</button>
                <button class="btn-calc btn-func" data-action="backspace">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                </button>
                <button class="btn-calc btn-func" data-action="percent">%</button>
                <button class="btn-calc btn-operator" data-action="operator" data-value="÷">÷</button>

                <button class="btn-calc btn-number" data-action="number" data-value="7">7</button>
                <button class="btn-calc btn-number" data-action="number" data-value="8">8</button>
                <button class="btn-calc btn-number" data-action="number" data-value="9">9</button>
                <button class="btn-calc btn-operator" data-action="operator" data-value="×">×</button>

                <button class="btn-calc btn-number" data-action="number" data-value="4">4</button>
                <button class="btn-calc btn-number" data-action="number" data-value="5">5</button>
                <button class="btn-calc btn-number" data-action="number" data-value="6">6</button>
                <button class="btn-calc btn-operator" data-action="operator" data-value="-">−</button>

                <button class="btn-calc btn-number" data-action="number" data-value="1">1</button>
                <button class="btn-calc btn-number" data-action="number" data-value="2">2</button>
                <button class="btn-calc btn-number" data-action="number" data-value="3">3</button>
                <button class="btn-calc btn-operator" data-action="operator" data-value="+">+</button>

                <button class="btn-calc btn-number btn-zero" data-action="number" data-value="0">0</button>
                <button class="btn-calc btn-number" data-action="decimal" data-value=".">.</button>
                <button class="btn-calc btn-equals" data-action="equals">=</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
