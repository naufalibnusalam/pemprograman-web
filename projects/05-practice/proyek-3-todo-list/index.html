<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List — Kelola Tugasmu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="container">
        <div class="app-card">
            <!-- Header -->
            <header class="app-header">
                <div>
                    <h1>📋 To-Do List</h1>
                    <p class="subtitle" id="task-summary">Belum ada tugas</p>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Semua</button>
                    <button class="filter-btn" data-filter="active">Aktif</button>
                    <button class="filter-btn" data-filter="completed">Selesai</button>
                </div>
            </header>

            <!-- Input Form -->
            <form class="input-section" id="todo-form">
                <input type="text" id="todo-input" placeholder="Tulis tugas baru..." autocomplete="off" required>
                <button type="submit" class="btn-add" id="btn-add">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </form>

            <!-- Task List -->
            <ul class="task-list" id="task-list">
                <!-- Tasks will be injected here by JS -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">✨</div>
                <p>Belum ada tugas. Tambahkan yang pertama!</p>
            </div>

            <!-- Footer -->
            <div class="app-footer" id="app-footer">
                <span id="remaining-count">0 tugas tersisa</span>
                <button class="btn-clear" id="btn-clear">Hapus Selesai</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
